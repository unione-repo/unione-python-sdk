[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "unione-sdk"
version = "1.2.4"
description = "UniOne Web API client library for Python"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "UniOne" }]
keywords = ["unione", "email", "api", "sdk"]
dependencies = []

[project.urls]
Homepage = "https://github.com/unione-repo/unione-python-sdk"
Documentation = "https://docs.unione.io/en/web-api-ref"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]
